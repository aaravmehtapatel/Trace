<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trace Check-ins</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1c1d1f; --muted: #6b6e75; --line: #e4e2dc;
    --accent: #2f5bd3; --accent-ink: #ffffff;
    --verified: #1f7a4d; --verified-bg: #e3f3ea; --documented: #2f5bd3; --documented-bg: #e6ecfb;
    --unanswered: #6b6e75; --unanswered-bg: #eeeeec; --withheld: #9a5a00; --withheld-bg: #fbefd9;
    --high: #b42318; --high-bg: #fde8e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141518; --panel: #1d1f23; --ink: #ecedef; --muted: #9a9ea6; --line: #2e3137;
      --accent: #7c9cff; --accent-ink: #0d1020;
      --verified: #6fd3a0; --verified-bg: #16382a; --documented: #8fabff; --documented-bg: #1f2a4a;
      --unanswered: #a9adb4; --unanswered-bg: #2a2c31; --withheld: #f0b55c; --withheld-bg: #3d2d12;
      --high: #ff8a80; --high-bg: #3d1c1a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
  .brand { font-weight: 650; letter-spacing: -0.01em; }
  .brand span { color: var(--muted); font-weight: 400; }
  .pill { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--unanswered-bg); color: var(--muted); }
  .pill.live { background: var(--documented-bg); color: var(--documented); }
  .pill.wait { background: var(--withheld-bg); color: var(--withheld); }
  .pill.ok { background: var(--verified-bg); color: var(--verified); }
  .pill.bad { background: var(--high-bg); color: var(--high); }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px 24px 40px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 16px; } }
  section.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-height: 70vh; overflow: hidden; }
  .pane-head { padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .who { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .pane-head h2 { margin: 2px 0 0; font-size: 19px; letter-spacing: -0.01em; }
  .pane-body { padding: 16px 20px; flex: 1; overflow: auto; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .row { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .meta { color: var(--muted); font-size: 13px; }
  button { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 7px 14px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: default; }
  .feed { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
  .feed li { padding: 6px 0; border-bottom: 1px dashed var(--line); display: flex; gap: 10px; }
  .feed .side { flex: 0 0 64px; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; padding-top: 1px; }
  .feed .side.vc { color: var(--accent); } .feed .side.startup { color: var(--verified); }
  .empty { color: var(--muted); text-align: center; padding: 48px 16px; }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; display: inline-block; animation: spin 0.9s linear infinite; vertical-align: -4px; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .q { font-weight: 600; margin: 0 0 6px; }
  .qid { color: var(--muted); font-weight: 500; margin-right: 6px; }
  .tier { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .tier.verified { background: var(--verified-bg); color: var(--verified); }
  .tier.documented { background: var(--documented-bg); color: var(--documented); }
  .tier.unanswered { background: var(--unanswered-bg); color: var(--unanswered); }
  .tier.withheld { background: var(--withheld-bg); color: var(--withheld); }
  .answer { white-space: pre-wrap; margin: 8px 0; }
  .answer.struck { text-decoration: line-through; color: var(--muted); }
  textarea { width: 100%; min-height: 110px; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--accent); background: var(--panel); color: var(--ink); }
  details { font-size: 13px; color: var(--muted); }
  details li { margin: 4px 0; }
  code { font-size: 12px; background: var(--unanswered-bg); padding: 1px 5px; border-radius: 4px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 6px 12px; font-size: 13.5px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on[data-a=approve] { background: var(--verified-bg); color: var(--verified); font-weight: 600; }
  .seg button.on[data-a=edit] { background: var(--documented-bg); color: var(--documented); font-weight: 600; }
  .seg button.on[data-a=withhold] { background: var(--withheld-bg); color: var(--withheld); font-weight: 600; }
  .sendbar { position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 12px 20px; }
  .report { font-size: 14.5px; }
  .report h1 { font-size: 20px; margin: 0 0 6px; } .report h2 { font-size: 16px; margin: 22px 0 8px; } .report h3 { font-size: 15px; }
  .report table { border-collapse: collapse; width: 100%; font-size: 13px; display: block; overflow-x: auto; }
  .report th, .report td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
  .report ul { padding-left: 20px; } .report li { margin: 4px 0; }
  .report hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
  .error { background: var(--high-bg); color: var(--high); padding: 12px 14px; border-radius: 8px; }
</style>
</head>
<body>
<header>
  <div class="brand">Trace <span>· portfolio check-ins</span></div>
  <div id="status" class="pill">Idle</div>
</header>
<main>
  <section class="pane">
    <div class="pane-head"><div class="who">Fund view · Northbeam Ventures</div><h2>Portfolio check-in</h2></div>
    <div class="pane-body">
      <div class="card">
        <div class="row">
          <div>
            <div class="q" style="margin:0">Tallyline</div>
            <div class="meta">Seed lead, $1.5M · Board seat: Elena Marsh · Next board meeting 2026-11-05</div>
          </div>
          <button id="start" class="primary">Request Q3 check-in</button>
        </div>
      </div>
      <div id="vc-error"></div>
      <div id="feed-wrap" class="card" hidden><div class="who" style="margin-bottom:6px">Activity</div><ul id="feed" class="feed"></ul></div>
      <div id="report" class="card report" hidden></div>
    </div>
  </section>

  <section class="pane">
    <div class="pane-head"><div class="who">Founder view · Tallyline</div><h2>Investor requests</h2></div>
    <div class="pane-body" id="founder"></div>
    <div class="sendbar" id="sendbar" hidden>
      <div class="row">
        <div class="meta" id="tally"></div>
        <button id="send" class="primary">Approve and send to Northbeam</button>
      </div>
    </div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const STATUS = {
  idle: ["Idle", ""], vc_working: ["Fund agent working", "live"], founder_drafting: ["Drafting from the data room", "live"],
  awaiting_founder: ["Waiting for the founder", "wait"], done: ["Report ready", "ok"], error: ["Error", "bad"],
};
let state = null, pendingKey = null, decisions = {};

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

function renderVc() {
  const [label, cls] = STATUS[state.phase];
  $("#status").textContent = label; $("#status").className = `pill ${cls}`;
  const running = !["idle", "done", "error"].includes(state.phase);
  $("#start").disabled = running;
  $("#start").textContent = state.phase === "idle" ? "Request Q3 check-in" : running ? "Check-in in progress" : "Run again";
  $("#vc-error").innerHTML = state.error ? `<div class="error">${esc(state.error)}</div>` : "";
  $("#feed-wrap").hidden = !state.log.length;
  $("#feed").innerHTML = state.log.map((l) => `<li><span class="side ${l.side}">${l.side === "vc" ? "Fund" : "Startup"}</span><span>${esc(l.text)}</span></li>`).join("")
    + (running && state.phase !== "awaiting_founder" ? `<li><span class="side"></span><span><span class="spinner"></span>working…</span></li>` : "");
  $("#report").hidden = !state.report;
  if (state.report && $("#report").dataset.key !== state.report.length + "") {
    $("#report").innerHTML = marked.parse(state.report);
    $("#report").dataset.key = state.report.length + "";
  }
}

function sources(a) {
  if (!a.sources.length) return "";
  return `<details><summary>${a.sources.length} source${a.sources.length > 1 ? "s" : ""}</summary><ul>${a.sources.map((s) =>
    `<li><code>${esc(s.path)}</code> @${esc(s.version)}: “${esc(s.quote)}”</li>`).join("")}</ul></details>`;
}

function renderFounder() {
  const p = state.pending;
  const key = p ? `${p.request.id}-${p.request.round}` : null;
  $("#sendbar").hidden = !p;
  if (!p) {
    pendingKey = null;
    const sent = state.sent.map((s) => {
      const n = (t) => s.response.answers.filter((a) => a.tier === t).length;
      return `<div class="card"><div class="q">Sent round ${s.request.round} to ${esc(s.request.fund)}</div><div class="meta">${s.request.questions.length} answers · ${n("verified")} verified · ${n("documented")} documented · ${n("unanswered")} unanswered · ${n("withheld")} withheld</div></div>`;
    }).join("");
    const waiting = state.phase === "founder_drafting"
      ? `<div class="empty"><span class="spinner"></span>Northbeam sent questions. Your agent is drafting answers from the data room…</div>`
      : state.sent.length ? "" : `<div class="empty">No requests yet. When Northbeam's agent asks for an update, the drafted answers appear here for you to approve.<br><br>Nothing is ever sent without your approval.</div>`;
    $("#founder").innerHTML = waiting + sent;
    return;
  }
  if (key === pendingKey) return updateTally();
  pendingKey = key;
  decisions = Object.fromEntries(p.draft.answers.map((a) => [a.question_id, { action: "approve", text: a.answer }]));
  const qs = Object.fromEntries(p.request.questions.map((q) => [q.id, q]));
  $("#founder").innerHTML = `<div class="card" style="background:var(--documented-bg);border-color:transparent">
      <div class="q" style="margin:0">${esc(p.request.fund)} asked ${p.request.questions.length} questions${p.request.round > 1 ? " (follow-up)" : ""}</div>
      <div class="meta">Your agent drafted every answer from the data room, with a source for each claim. Review, then send.</div></div>`
    + p.draft.answers.map((a) => `<div class="card" data-q="${a.question_id}">
      <div class="row" style="align-items:flex-start"><p class="q"><span class="qid">${esc(a.question_id)}</span>${esc(qs[a.question_id].text)}</p><span class="tier ${a.tier}">${a.tier}</span></div>
      <div class="answer">${esc(a.answer)}</div>
      ${sources(a)}
      <div class="row" style="margin-top:10px;justify-content:flex-end">
        <div class="seg">${["approve", "edit", "withhold"].map((x) => `<button data-a="${x}" class="${x === "approve" ? "on" : ""}">${x[0].toUpperCase() + x.slice(1)}</button>`).join("")}</div>
      </div></div>`).join("");
  $("#founder").querySelectorAll(".card[data-q]").forEach((card) => {
    const id = card.dataset.q;
    card.querySelectorAll(".seg button").forEach((b) => b.onclick = () => {
      decisions[id].action = b.dataset.a;
      card.querySelectorAll(".seg button").forEach((x) => x.classList.toggle("on", x === b));
      const box = card.querySelector(".answer");
      box.classList.toggle("struck", b.dataset.a === "withhold");
      if (b.dataset.a === "edit" && !card.querySelector("textarea")) {
        const t = document.createElement("textarea");
        t.value = decisions[id].text;
        t.oninput = () => (decisions[id].text = t.value);
        box.replaceWith(t);
        t.focus();
      } else if (b.dataset.a !== "edit" && card.querySelector("textarea")) {
        const div = document.createElement("div");
        div.className = "answer" + (b.dataset.a === "withhold" ? " struck" : "");
        div.textContent = decisions[id].text;
        card.querySelector("textarea").replaceWith(div);
      }
      updateTally();
    });
  });
  updateTally();
}

function updateTally() {
  const v = Object.values(decisions);
  const n = (a) => v.filter((d) => d.action === a).length;
  $("#tally").textContent = `${n("approve")} approved · ${n("edit")} edited · ${n("withhold")} withheld`;
}

async function tick() {
  try {
    state = await api("/api/state");
    renderVc();
    renderFounder();
  } catch (e) { /* server restarting */ }
}

$("#start").onclick = async () => {
  $("#report").dataset.key = "";
  try { await api("/api/start", {}); } catch (e) { alert(e.message); }
  tick();
};
$("#send").onclick = async () => {
  $("#send").disabled = true;
  try { await api("/api/approve", { decisions }); } catch (e) { alert(e.message); }
  $("#send").disabled = false;
  tick();
};
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
